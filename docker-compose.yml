services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

  app:
    build: ./app
    environment:
      DATABASE_URL: postgresql://websec:websec@db:5432/websec
    depends_on:
      - db

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: websec
      POSTGRES_PASSWORD: websec
      POSTGRES_DB: websec
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
